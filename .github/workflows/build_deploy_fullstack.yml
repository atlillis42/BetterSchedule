name: Build & Deploy API + SPA (single App Service, npm)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"
  AZURE_WEBAPP_NAME: "betterschedule-api"
  PROJECT_PATH: "BetterSchedule.Server/BetterSchedule.Server.csproj"
  FRONTEND_DIR: "betterschedule.client"
  WWWROOT_DIR: "BetterSchedule.Server/wwwroot"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISH_DIR: ./publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Build SPA (npm) ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install deps (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_BASE_URL: "/"
        run: npm run build

      - name: Stage SPA into wwwroot
        run: |
          mkdir -p "${{ env.WWWROOT_DIR }}"
          rm -rf "${{ env.WWWROOT_DIR }}"/*
          cp -R "${{ env.FRONTEND_DIR }}/dist/." "${{ env.WWWROOT_DIR }}/"

      # --- Build API (includes static files in wwwroot) ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --no-restore -c Release

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --no-build -c Release -o "$PUBLISH_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-publish
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-publish
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish
