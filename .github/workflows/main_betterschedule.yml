name: Deploy API+SPA to Azure App Service

on:
  push:
    branches: [ main ]
    paths:
      - 'BetterSchedule.Server/**'
      - 'betterschedule.client/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Build SPA (Vite) ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build SPA
        working-directory: ./betterschedule.client
        run: |
          npm ci
          npm run build

      # --- Copy SPA build into Server/wwwroot so API serves it ---
      - name: Copy SPA build into Server/wwwroot
        run: |
          rm -rf ./BetterSchedule.Server/wwwroot || true
          mkdir -p ./BetterSchedule.Server/wwwroot
          cp -R ./betterschedule.client/dist/* ./BetterSchedule.Server/wwwroot/

      # --- Publish API ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./BetterSchedule.Server/BetterSchedule.Server.csproj

      - name: Publish API (with SPA files)
        run: dotnet publish ./BetterSchedule.Server/BetterSchedule.Server.csproj -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      # Use OIDC (what you currently have):
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1679B72640F4451AAAAA352D751F4498 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D708E4C6615342E2A8AAED0053971631 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_36CEAF19289C4CA28214A2F50EAA4723 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: BetterSchedule
          slot-name: Production
          package: ./publish


          
