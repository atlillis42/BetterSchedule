name: Build, deploy, and migrate BetterSchedule API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  AZURE_WEBAPP_NAME: "betterschedule-api"
  AZURE_RESOURCE_GROUP: "BetterSchedule"
  PROJECT_PATH: "BetterSchedule.Server/BetterSchedule.Server.csproj"
  HEALTH_ENDPOINT: "https://betterschedule-api-edb3eeawckh5bebu.centralus-01.azurewebsites.net/healthz"
  HEALTH_TIMEOUT_SECONDS: "240"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISH_DIR: ./publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"
      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --no-restore -c Release
      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" --no-build -c Release -o "$PUBLISH_DIR"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_DIR }}

  deploy-and-migrate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set and show Azure subscription
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euxo pipefail
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az account show -o table

      - name: Verify resource group and web app
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euxo pipefail
            az group show -n "${{ env.AZURE_RESOURCE_GROUP }}" -o table
            az webapp show -g "${{ env.AZURE_RESOURCE_GROUP }}" -n "${{ env.AZURE_WEBAPP_NAME }}" -o table

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./publish

      - name: Enable migrations at startup
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euxo pipefail
            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --settings "Data:RunMigrationsOnStartup=true"

      - name: Restart Web App to run migrations
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euxo pipefail
            az webapp restart --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

      - name: Wait for health
        shell: bash
        run: |
          set -euxo pipefail
          end=$((SECONDS + $HEALTH_TIMEOUT_SECONDS))
          while [ $SECONDS -lt $end ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_ENDPOINT")
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Disable migrations at startup
        if: always()
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euxo pipefail
            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --settings "Data:RunMigrationsOnStartup=false"

      - name: Restart Web App (final)
        if: always()
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euxo pipefail
            az webapp restart --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"
